[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags = 
    -std=c++17
    -D UNIT_TEST
    -I include
    -I src
test_build_src = yes
src_filter = +<*.cpp> -<main.cpp>
