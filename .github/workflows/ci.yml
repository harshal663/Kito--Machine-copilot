name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install backend dependencies
        run: cd backend && uv sync

      - name: Backend lint & format check
        run: cd backend && uv run ruff check . && uv run ruff format --check .

      - name: Backend typecheck
        run: cd backend && uv run mypy --strict app

      - name: Backend unit tests
        run: cd backend && uv run pytest tests/unit

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot_test
          DATABASE_URL_TEST: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot_test
        run: cd backend && uv run alembic upgrade head

      - name: Backend integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot_test
          DATABASE_URL_TEST: postgresql+asyncpg://copilot:copilot@localhost:5432/copilot_test
          REDIS_URL: redis://localhost:6379/0
        run: cd backend && uv run pytest tests/integration

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend lint
        run: cd frontend && npm run lint

      - name: Frontend typecheck
        run: cd frontend && npm run typecheck

      - name: Frontend tests
        run: cd frontend && npm test

      - name: Frontend build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: cd frontend && npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check OpenAPI and TypeScript contract drift
        run: |
          cd backend && uv sync
          uv run python ../scripts/export_openapi.py
          cd ../frontend && npm ci && npm run generate-types
          git diff --exit-code -- ../docs/openapi.json src/types/api.generated.ts

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run native firmware tests
        run: |
          cd firmware
          g++ -std=c++17 -D UNIT_TEST -I include -I src -I test/test_native test/test_native/test_main.cpp src/baseline.cpp src/detector.cpp src/fft_analyzer.cpp src/telemetry_client.cpp -o test_runner
          ./test_runner
