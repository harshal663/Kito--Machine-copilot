services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: machine_copilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: machine_copilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machine_copilot_api
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      - DATABASE_URL_TEST=postgresql+asyncpg://copilot:copilot@postgres:5432/copilot_test
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machine_copilot_worker
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://copilot:copilot@postgres:5432/copilot
      - DATABASE_URL_TEST=postgresql+asyncpg://copilot:copilot@postgres:5432/copilot_test
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

